[project]
name = "academy-edtech-analysis"
version = "0.1.0"
description = "Analyse exploratoire des données de la Banque Mondiale pour Academy EdTech."
authors = [
    {name = "OpenClassRooms Data Engineering & IA", email = "jf.c.webcraft@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "openpyxl>=3.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"